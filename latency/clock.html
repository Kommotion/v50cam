<!doctype html><html><head><title>latency clock</title><style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Consolas,monospace}
#c{display:flex;align-items:center;justify-content:center;height:100%;font-size:21vw;font-weight:bold;letter-spacing:-.02em}
</style></head><body><div id="c">00000</div><script>
const c=document.getElementById('c');const t0=performance.now();
function f(){c.textContent=String(Math.floor(performance.now()-t0)%100000).padStart(5,'0');requestAnimationFrame(f)}f();
</script></body></html>
